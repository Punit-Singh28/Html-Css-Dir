<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Table & Form</title>
    <style>
      table,
      th,
      td {
        border: 1px solid black;
      }
    </style>
  </head>
  <body>
    <table>
      <thead>
        <tr>
          <th colspan="2">
            <h1>HTML5 Form</h1>
          </th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Select your favourite color:</td>
          <td><input type="color" name="color" id="color"></td>
        </tr>
         <tr>
          <td>Birthday:</td>
          <td><input type="date" name="date" id="date"></td>
          </tr>
          <tr>
          <td>Birthday:</td>
          <td><input type="datetime" name="time" id="time"></td>
        </tr>
        <tr>
            <td>E-mail:</td>
            <td><input type="email" name="email" id="email"></td>
        </tr>
        <tr>
            <td>Birthday(month and year):</td>
            <td><input type="month" id=""></td>
        </tr>
        <tr>
            <td></td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
