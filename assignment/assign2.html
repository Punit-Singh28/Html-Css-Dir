<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Application Form</title>
  </head>
  <body>
    <h1>Application Form</h1>
    <form>
      <label for="name">First Name</label>
      <input type="text" name="name" id="name" />
      <label for="surname">Last Name</label>
      <input type="text" name="surname" id="surname" /><br /><br />
      <label for="dob">Date of birth:</label>
      <input type="date" name="dob" id="dob" />
      <label for="age">Age:</label>
      <input type="number" min="1" max="50" />
      <br />
      <br />
      <label for="gender">Gender</label>
      <select name="gender" id="gender">
        <option value="Male">Male</option>
        <option value="Female">Female</option>
      </select>
      <label for="email">Email Address</label>
      <input
        type="email"
        name="email"
        id="email"
        placeholder="Enter email address"
      />
      <br />
      <p>
        Position Available: 
        <input type="radio" name="r1" id="r1" />
        <label for="r1">Junior Developer</label>
        <input type="radio" name="r2" id="r2" />
        <label for="r2">Mid-level Developer</label>
        <input type="radio" name="r3" id="r3" />
        <label for="r3">Senior Developer</label>
      </p>
      <p>
        Position Available: 
        <input type="checkbox" name="r11" id="r11" />
        <label for="r11">Java</label>
        <input type="checkbox" name="r22" id="r22" />
        <label for="r22">Javascript</label>
        <input type="radio" name="r33" id="r33" />
        <label for="r33">Python</label>
      </p>
      <label for="pass">Password:</label>
      <input type="password" id="pass">
      <label for="cpass">Confirm Password:</label>
      <input type="password" id="cpass">
      <br><br>
      <input type="submit" value="submit">
      <input type="reset" value="Reset">
    </form>
  </body>
</html>
