<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags</title>
    <style>
        .cont{
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-wrap: wrap;
            margin: 20px auto;
            width: 400px;
            gap: 15px;
        }
        .cont1{
            display: flex;
            justify-content: space-between;
        }
        .cont2{
            display: flex;
            justify-content: space-between;
        }
        .cont3{
            display: flex;
            justify-content: space-between;

        }
        .tag1{
            padding: 10px 20px;
            background: rgb(1, 1, 56);
            border-radius: 10px;
            color: antiquewhite;
        }
    </style>
</head>
<body>
    <div class="cont">
        <div class="cont1">
            <div class="tag1">Turnip</div>
        <div class="tag1">greens</div>
        <div class="tag1">yarrow</div>
        <div class="tag1">ricebeans</div>
        </div>
        <div class="cont2">
            <div class="tag1">rutabaga</div>
        <div class="tag1">endive</div>
        <div class="tag1">cauliflower</div>
        </div>
       <div class="cont3">
         <div class="tag1">sea lettuce</div>
        <div class="tag1">kohlrabi</div>
        <div class="tag1">amaranth</div>
       </div>
    </div>
</body>
</html>
