<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    <style>
        .grid-cont{
            display: grid;
            height: 300px;
            width: 600px;
            gap: 5px
            ;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: 1fr, 1fr, 1fr;
            grid-template-areas: "child1 child2 child4"
                                 "child3 child3 child5"
                                 "child6 child7 .";

        }
        .box{
            height: 100px;
            width: 100px;
            background: rgb(224, 76, 101);
            text-transform: capitalize;
            font-size: 20px;
            text-align: center;
            text-justify: auto;
        }
        .child-1{
            grid-area: child1;
        }
        .child-2{
            grid-area: child2;
        }
        .child-3{
            grid-area: child3;
        }
        .child-4{
            grid-area: child4;
        }
        .child-5{
            grid-area: child5;
        }
        .child-6{
            grid-area: child6;
        }
        .child-7{
            grid-area: child7;
        }
    </style>
</head>
<body>
    <div class="grid-cont">
        <div class="box child-1">1</div>
        <div class="box child-2">2</div>
        <div class="box child-3">3</div>
        <div class="box child-4">4</div>
        <div class="box child-5">5</div>
        <div class="box child-6">6</div>
        <div class="box child-7">7</div>
    </div>
</body>
</html>
